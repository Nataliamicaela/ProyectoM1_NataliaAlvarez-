<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de paletas</title>
    <link rel="stylesheet" href="./CSS/styles.css">
</head>
<body>
    <header>
          <h1>Generador de paletas de colores</h1>
          <p>Combinaciones de colores aleatorias</p>
    </header>

    <main>
        <section aria-labelledby="titulo-paleta">
            <h2 id="titulo-paleta">¡Creá tu paleta!</h2>

            <form id="form-paleta">
                <div>
                    <label for="cantidad-colores">Cantidad de colores:</label>
                    <select id="cantidad-colores" name="cantidad">
                        <option value="6">6 colores</option>
                        <option value="8">8 colores</option>
                        <option value="9">9 colores</option>
                  </select>
                </div>

                <div>
                    <label for="formato-color">Formato de color:</label>
                    <select id="formato-color">
                        <option value="hex">HEX</option>
                        <option value="hsl">HSL</option>
                </select>
                </div>

                <button type="submit" id="generar-btn" >Generar paleta</button>
            </form>
        </section>

        <section id="paleta" aria-live="polite"></section>
        <button type="button" id="guardar-paleta-btn">Guardar paleta</button>
        <section>
            <h2 class="paletas-guardadas">Paletas guardadas</h2>
            <div id="paletas-guardadas"></div>
        </section>
    </main>

    <script src="./JS/script.js"></script>

    <footer>
        <p>Hecho por Natalia Alvarez para ColorFly Studio</p>
    </footer>
</body>
</html>
